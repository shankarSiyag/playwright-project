name: Playwright Tests CI CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log Level'
        required: true
        default: 'warning'
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log Level'
        required: true
        default: 'warning'

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20                          # ✅ upgraded from 18

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      # ✅ FIXED: Single step — headed + sharded, no duplicate run
      - name: Run Playwright Tests (Headed + Sharded)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          LOG_LEVEL: ${{ github.event.inputs.logLevel }}   # ✅ logLevel wired up

      - name: Verify blob-report exists
        run: |
          if [ ! -d "blob-report" ]; then
            echo "ERROR: blob-report not found. Ensure 'blob' reporter is enabled in playwright.config.ts"
            exit 1
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: always()
    needs: [playwright-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20                          # ✅ upgraded from 18

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -R

      - name: Verify reports directory
        run: |
          if [ ! -d "all-blob-reports" ]; then
            echo "ERROR: all-blob-reports directory not found"
            exit 1
          fi

      - name: Merge reports into HTML
        run: npx playwright merge-reports --reporter html all-blob-reports

      - name: Upload final Playwright report
        if: always()                                # ✅ added
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14